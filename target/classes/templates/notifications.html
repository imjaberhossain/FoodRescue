<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body class="bg-paper font-sans text-ink antialiased">

<header th:replace="~{fragments :: navbar}"></header>

<main class="mx-auto max-w-2xl px-4 py-10">
    <div class="flex items-center justify-between">
        <h1 class="font-display text-3xl font-extrabold">Notifications</h1>
        <form th:action="@{/notifications/mark-read}" method="post">
            <button type="submit" class="fr-btn-outline">Mark all as read</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="mt-6 rounded-lg border border-dashed border-line bg-white p-8 text-sm text-ink/70">
        No notifications yet. You'll see an alert here when food or an event is posted near you.
    </div>

    <ul th:unless="${#lists.isEmpty(notifications)}" class="mt-6 divide-y divide-line rounded-lg border border-line bg-white">
        <li th:each="n : ${notifications}" class="p-4" th:classappend="${!n.read} ? 'bg-leaf-tint/40' : ''">
            <a th:href="${n.link != null ? n.link : '#'}" class="block">
                <p class="text-sm" th:text="${n.message}">Message</p>
                <p class="mt-1 text-xs text-ink/50" th:text="${#temporals.format(n.createdAt, 'dd MMM, hh:mm a')}">21 Sep</p>
            </a>
        </li>
    </ul>
</main>

</body>
</html>
