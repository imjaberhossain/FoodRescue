spring.application.name=foodrescue
server.port=8080

# ---------- PostgreSQL connection (CHANGE the password!) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/foodrescue
spring.datasource.username=postgres
spring.datasource.password=162699
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- Tables are created by schema.sql (safe to run many times) ----------
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---------- File uploads (NID/document, profile photo) ----------
# Files are saved on disk under this folder (created automatically).
foodrescue.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Login session ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
